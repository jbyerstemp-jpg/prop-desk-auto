name: Import OCR runtime assets

on:
  push:
    branches: ["pda/app-clone-today"]
    paths: [".github/workflows/import-ocr-assets.yml"]

permissions:
  contents: write

concurrency:
  group: pda-ocr-assets
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pda/app-clone-today
      - name: Restore pinned Tesseract runtime and English language data
        run: |
          set -euo pipefail
          dest="vendor/tesseract"
          mkdir -p "$dest/lang"
          base="https://raw.githubusercontent.com/jbyerstemp-jpg/prop-desk/ed3aafc7ba820bd2f2c347e3859f428060332667/vendor/tesseract"
          for file in tesseract-core-lstm.wasm.js tesseract-core-simd-lstm.wasm.js lang/eng.traineddata.gz LICENSE-tesseract-core LICENSE-tesseract.js.md; do
            if [ ! -s "$dest/$file" ]; then
              curl --fail --location --retry 3 --silent --show-error "$base/$file" -o "$dest/$file"
            fi
          done
          test "$(wc -c < "$dest/tesseract-core-lstm.wasm.js")" -gt 3000000
          test "$(wc -c < "$dest/tesseract-core-simd-lstm.wasm.js")" -gt 3000000
          test "$(wc -c < "$dest/lang/eng.traineddata.gz")" -gt 2000000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "assets: restore pinned Tesseract OCR runtime"
            git push origin HEAD:pda/app-clone-today
          fi
