name: Prop monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 min (GitHub may run a few minutes late)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['monitor/watch.json']   # the app saving new positions starts a check right away
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Get repo (no third-party actions)
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" repo
      - name: Run the model
        working-directory: repo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_PROP }}
          PATTERN_LAB_TOKEN: ${{ secrets.PATTERN_LAB_TOKEN }}
          PATTERN_LAB_REPO: ${{ vars.PATTERN_LAB_REPO }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC_PROP secret not set: nothing to alert, skipping (see MONITOR-SETUP.md)."; exit 0; fi
          node monitor/run.js
      - name: Save alert memory (only if it changed)
        working-directory: repo
        run: |
          git config user.name "prop-monitor-bot"
          git config user.email "prop-monitor-bot@users.noreply.github.com"
          git add monitor/state.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "monitor: alert memory"
          git pull -q --rebase origin main && git push -q origin HEAD:main
